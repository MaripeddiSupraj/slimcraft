[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slimcraft"
version = "0.1.0"
description = "Agentic container hardening CLI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "dockerfile-parse>=2.0.1",
    "docker>=7.0.0"
]

[project.scripts]
slimcraft = "slimcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8"
]
